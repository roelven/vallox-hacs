[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # Home Assistant ships a few pyOpenSSL/aiohttp deprecation warnings we don't own.
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Match the HA core selection: a pragmatic subset that catches real issues
# without enforcing every nitpicky rule the core repo enables via its own config.
select = [
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "PGH",    # pygrep-hooks
  "RUF",    # ruff-specific
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
]
ignore = [
  "E501",   # line length handled by formatter
  "UP017",  # timezone: use ZoneInfo (HA still uses get_default_time_zone helper)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
split-on-trailing-comma = true